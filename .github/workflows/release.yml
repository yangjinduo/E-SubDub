# E-SubDub Windows 发行构建
# ====================================================================
# 触发：推送 v* 标签（如 v0.1.0）或手动 workflow_dispatch。
# 流程：Nuitka standalone 编译（不含 torch 等推理大件，主程序仅
#       数百 MB）→ 内嵌便携 CPython → vpk pack 产出 Velopack 更新
#       feed（构建前 vpk download github 拉取上一版以生成增量包）→
#       Inno 向导包装出首装包并覆盖 feed 内 Setup.exe → vpk upload
#       github --publish 发布 Release（tag 触发时）。
# 校验：tag 与 app/core/config.py 的 APP_VERSION 不一致时构建失败。
# 说明：Windows runner 可用磁盘约 14 GB；因方案 C 不打包 torch /
#       transformers / demucs（应用内 .venv-ml 按需搭建），
#       构建依赖仅 PySide6 / librosa 等小件，磁盘富余。
# ====================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装构建依赖（最小集，不含 torch / transformers / demucs）
        run: |
          pip install -r build/requirements-freeze.txt
          # Nuitka 必须钉 4.2.2：4.3 在 PySide6 6.9.3 冻结态触发确定性
          # access violation（启动即崩，详见 build_windows.ps1 头部注释）
          pip install nuitka==4.2.2

      - name: 安装 vpk（Velopack 打包 CLI，windows-latest 自带 .NET SDK）
        run: dotnet tool install -g vpk

      - name: 校验 tag 与 APP_VERSION 一致性
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $config = Get-Content -Raw app/core/config.py
          if ($config -notmatch 'APP_VERSION:\s*str\s*=\s*"([^"]+)"') {
            throw '无法从 app/core/config.py 解析 APP_VERSION'
          }
          $version = $Matches[1]
          if ($version -ne $tag) {
            throw "tag($tag) 与 APP_VERSION($version) 不一致：请先在 app/core/config.py 中更新版本号再打 tag"
          }
          Write-Host "版本一致：$version"

      - name: 缓存便携 CPython（python-build-standalone）
        uses: actions/cache@v4
        with:
          path: build/runtime
          key: pbs-cpython-3.13.5-20250723-x86_64-win

      # build_windows.ps1 不再自动下载便携 CPython（本地构建由用户手动放置，
      # 缺失时打印下载链接中止）；CI 用固定 URL 拉取同一发行包
      - name: 准备便携 CPython（缓存未命中时下载）
        shell: pwsh
        run: |
          $py = 'build/runtime/python/python.exe'
          if (Test-Path $py) {
            Write-Host '便携 CPython 缓存命中'
          } else {
            $url = 'https://github.com/astral-sh/python-build-standalone/releases/download/20250723/cpython-3.13.5+20250723-x86_64-pc-windows-msvc-install_only_stripped.tar.gz'
            New-Item -ItemType Directory -Force -Path 'build/runtime' | Out-Null
            curl.exe -L -o cpython.tar.gz $url
            if ($LASTEXITCODE -ne 0) { throw '下载便携 CPython 失败' }
            tar -xzf cpython.tar.gz -C 'build/runtime'
            if ($LASTEXITCODE -ne 0) { throw '解压便携 CPython 失败' }
            Remove-Item cpython.tar.gz
            if (-not (Test-Path $py)) { throw "解压后布局异常：未找到 $py" }
          }

      - name: 确保 Inno Setup 可用
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          } else {
            Write-Host "ISCC 已预装：$((Get-Command ISCC).Source)"
          }

      # 拉取上一版更新包到 feed 目录：vpk pack 据此生成增量 delta 包。
      # 无历史版本（首版发布）时 vpk download 可能失败，容错继续
      #（只产全量包，不影响发布正确性）
      - name: 拉取上一版更新包（vpk download github，增量 delta 所需）
        shell: pwsh
        run: |
          $vpk = Join-Path $env:USERPROFILE '.dotnet\tools\vpk.exe'
          New-Item -ItemType Directory -Force -Path 'build/dist/update-feed' | Out-Null
          & $vpk download github --repoUrl https://github.com/yangjinduo/E-SubDub --outputDir 'build/dist/update-feed'
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'vpk download 未拉到历史版本（可能为首版发布），将只产出全量包'
          }

      - name: 构建（Nuitka + vpk pack + Inno 首装包）
        shell: pwsh
        run: ./build/build_windows.ps1

      # vpk upload github：将 feed 目录（releases.win.json + 全量/增量
      # nupkg + 已被 Inno 首装包覆盖的 Setup.exe）发布为 GitHub Release，
      # 替代原 softprops/action-gh-release；已安装客户端的增量升级依赖
      # 此 Release 中的 feed 文件
      - name: 发布更新 feed 到 GitHub Releases（vpk upload github）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $vpk = Join-Path $env:USERPROFILE '.dotnet\tools\vpk.exe'
          & $vpk upload github --repoUrl https://github.com/yangjinduo/E-SubDub --publish --tag '${{ github.ref_name }}' --outputDir 'build/dist/update-feed' --token $env:GITHUB_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "vpk upload 失败（exit $LASTEXITCODE）" }

      - name: 归档 onedir 发行目录（供手动触发时下载验证）
        uses: actions/upload-artifact@v4
        with:
          name: ESubDub-onedir-${{ github.run_number }}
          path: build/dist/ESubDub
          if-no-files-found: error
